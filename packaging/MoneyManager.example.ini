; Money Manager — example configuration (optional).
;
; To use it, copy this file next to MoneyManager.exe and rename the copy to
; "MoneyManager.ini", or point the MONEY_MANAGER_CONFIG environment variable at
; it. Without a configuration file Money Manager keeps its data in
; %LOCALAPPDATA%\MoneyManager, which is right for most people.
;
; Environment variables MONEY_MANAGER_DATA_DIR and MONEY_MANAGER_LOG_LEVEL
; override the values below.
;
; Never put API keys in this file. The Anthropic API key is saved in the
; Windows Credential Manager from Settings -> AI assistant (or read from the
; ANTHROPIC_API_KEY environment variable). AI and currency choices are stored in
; the database, so they travel with backups.

[money_manager]
; Where the database, logs and safety backups are kept. A relative path is
; relative to this file, so "data" keeps everything beside the program
; (portable use, e.g. on a USB drive). Environment variables such as
; %USERPROFILE% are expanded.
; data_dir = data

; DEBUG, INFO, WARNING, ERROR or CRITICAL. Logs never contain amounts or keys.
; log_level = INFO
